name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests --junitxml=results/junit.xml
      - name: CLI smoke test (no API key needed)
        run: |
          for f in md csv robot gherkin; do testgen --from-json examples/login_test_cases.json --format $f > /dev/null; done
          testgen --input examples/booking_openapi.yaml --dry-run > /dev/null
